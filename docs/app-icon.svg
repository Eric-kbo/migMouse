<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MigMouse app icon</title>
  <desc id="desc">A white touch mouse with purple and blue touch points on a deep violet background</desc>
  <defs>
    <linearGradient id="background" x1="118" y1="96" x2="906" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171D3D"/>
      <stop offset="0.48" stop-color="#352C89"/>
      <stop offset="1" stop-color="#7445E9"/>
    </linearGradient>
    <linearGradient id="mouse" x1="512" y1="178" x2="512" y2="846" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.48" stop-color="#F3F6FF"/>
      <stop offset="1" stop-color="#D8E5FA"/>
    </linearGradient>
    <linearGradient id="rim" x1="256" y1="196" x2="770" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#C7D2FE" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="purpleGlow">
      <stop stop-color="#A78BFA" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow">
      <stop stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#080B22" flood-opacity="0.42"/>
    </filter>
    <filter id="mouseShadow" x="-30%" y="-20%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="25" flood-color="#090E2D" flood-opacity="0.42"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="64" y="64" width="896" height="896" rx="206"/>
    </clipPath>
  </defs>

  <g filter="url(#cardShadow)">
    <rect x="64" y="64" width="896" height="896" rx="206" fill="url(#background)"/>
  </g>
  <g clip-path="url(#cardClip)">
    <circle cx="842" cy="174" r="300" fill="url(#purpleGlow)"/>
    <circle cx="168" cy="840" r="330" fill="url(#blueGlow)"/>
    <path d="M-30 820 C190 680 342 914 568 798 C738 711 844 700 1064 812 V1038 H-30Z" fill="#FFFFFF" opacity="0.055"/>
    <path d="M775 38 C750 258 878 330 1024 346 V38Z" fill="#FFFFFF" opacity="0.045"/>
  </g>

  <g filter="url(#mouseShadow)">
    <path d="M512 174 C681 174 775 321 775 588 V675 C775 773 696 852 598 852 H426 C328 852 249 773 249 675 V588 C249 321 343 174 512 174Z" fill="url(#mouse)" stroke="url(#rim)" stroke-width="5"/>
    <path d="M512 177 V403" stroke="#9C83F5" stroke-width="7" stroke-linecap="round" opacity="0.58"/>

    <circle cx="414" cy="336" r="66" fill="#8B5CF6" opacity="0.10"/>
    <circle cx="414" cy="336" r="47" fill="none" stroke="#A78BFA" stroke-width="7" opacity="0.42"/>
    <circle cx="414" cy="336" r="25" fill="#8B5CF6"/>
    <circle cx="414" cy="336" r="12" fill="#C4B5FD" opacity="0.48"/>

    <circle cx="610" cy="336" r="66" fill="#38BDF8" opacity="0.10"/>
    <circle cx="610" cy="336" r="47" fill="none" stroke="#38BDF8" stroke-width="7" opacity="0.34"/>
    <circle cx="610" cy="336" r="25" fill="#38BDF8"/>
    <circle cx="610" cy="336" r="12" fill="#BAE6FD" opacity="0.54"/>
  </g>

  <rect x="65.5" y="65.5" width="893" height="893" rx="204.5" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.14"/>
</svg>
